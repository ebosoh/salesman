<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#172554" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Sewak Plastics - Water Tanks & Plumbing Pipes Field Sales Tracker" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <title>Sewak Plastics - Field Sales Tracker</title>
  </head>
  <body class="bg-surface-muted text-slate-800 antialiased selection:bg-brand-red selection:text-white">
    <div id="root"></div>
    <script>
      (function() {
        function purgeLovable() {
          try {
            const elements = document.querySelectorAll(
              '#lovable-badge, .lovable-badge, [data-lovable], [data-lovable-badge], [data-component-name="LovableBadge"], a[href*="lovable.dev"], a[href*="lovable.app"], iframe[src*="lovable"]'
            );
            elements.forEach(function(el) { el.remove(); });

            const allElements = document.querySelectorAll('button, a, div, span, p');
            for (let i = 0; i < allElements.length; i++) {
              const el = allElements[i];
              if (el.children.length === 0 && el.textContent && el.textContent.toLowerCase().includes('edit with lovable')) {
                const parent = el.closest('div, a, button');
                if (parent && parent !== document.body && parent !== document.getElementById('root')) {
                  parent.remove();
                } else {
                  el.remove();
                }
              }
            }
          } catch (e) {}
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', purgeLovable);
        } else {
          purgeLovable();
        }

        const observer = new MutationObserver(purgeLovable);
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
